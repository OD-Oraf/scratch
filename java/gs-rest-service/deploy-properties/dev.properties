# App-level deploy configuration for DEV environment
# Keys use Maven -D property names so the composite action maps them directly.
# Org-level values (rtf.target, anypoint.businessGroupId, etc.) are NOT here —
# they come from the caller workflow.

rtf.applicationName=my-mule-app
rtf.replicas=1
rtf.cpuReserved=500m
rtf.cpuMax=1000m
rtf.memoryReserved=700Mi
rtf.memoryMax=1000Mi
rtf.provider=MC
mule.env=dev
skipTests=true
