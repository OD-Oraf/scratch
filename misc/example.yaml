- name: Check current state
  id: check_state
  run: |
    COMMAND_ID=$(aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --instance-ids "i-1234567890abcdef0" \
      --parameters 'commands=["ls -la /var/app", "df -h", "whoami"]' \
      --output text \
      --query "Command.CommandId")
    
    aws ssm wait command-executed \
      --command-id "$COMMAND_ID" \
      --instance-id "i-1234567890abcdef0"
    
    aws ssm get-command-invocation \
      --command-id "$COMMAND_ID" \
      --instance-id "i-1234567890abcdef0" \
      --query "StandardOutputContent" \
      --output text

- name: Clone repository
  id: clone_repo
  run: |
    COMMAND_ID=$(aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --instance-ids "i-1234567890abcdef0" \
      --parameters commands="
        set -e
        cd /var/app
        if [ -d 'repo' ]; then
          echo 'Repository exists, pulling latest...'
          cd repo && git pull
        else
          echo 'Cloning repository...'
          git clone https://github.com/org/repo.git repo
        fi
      " \
      --output text \
      --query "Command.CommandId")
    
    aws ssm wait command-executed \
      --command-id "$COMMAND_ID" \
      --instance-id "i-1234567890abcdef0"
    
    aws ssm get-command-invocation \
      --command-id "$COMMAND_ID" \
      --instance-id "i-1234567890abcdef0" \
      --query "StandardOutputContent" \
      --output text

- name: Run application
  id: run_app
  run: |
    COMMAND_ID=$(aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --instance-ids "i-1234567890abcdef0" \
      --parameters 'commands=["cd /var/app/repo && ./run-app.sh"]' \
      --output text \
      --query "Command.CommandId")
    
    aws ssm wait command-executed \
      --command-id "$COMMAND_ID" \
      --instance-id "i-1234567890abcdef0"
    
    # Get full details for final step
    INVOCATION=$(aws ssm get-command-invocation \
      --command-id "$COMMAND_ID" \
      --instance-id "i-1234567890abcdef0" \
      --output json)
    
    STATUS=$(echo "$INVOCATION" | jq -r '.Status')
    echo "$INVOCATION" | jq -r '.StandardOutputContent'
    
    if [ "$STATUS" != "Success" ]; then
      echo "::error::Application failed to start"
      echo "$INVOCATION" | jq -r '.StandardErrorContent'
      exit 1
    fi