name: 'Mule RTF Deploy via Maven'
description: |
  Deploys a MuleSoft application to Runtime Fabric (RTF) using mvn deploy.
  Supports three-layer configuration (highest priority first):
    1. Explicit inputs     — passed directly by the caller
    2. Org properties file — written by the caller (org-specific, per-env)
    3. App properties file — checked into the app repo (app-specific, per-env)
    4. Hardcoded defaults  — built into this action
  Both properties files use Maven -D property names as keys (key=value format).

inputs:
  # ── Properties files ──────────────────────────────────────────
  deploy_properties_file:
    description: |
      Path to org-level properties file (typically written to RUNNER_TEMP
      by the caller).  Contains org-specific values such as:
        anypoint.environment, anypoint.businessGroupId, rtf.target,
        rtf.provider, connected.app.grantType, mule.env
    required: false
    default: ''
  app_properties_file:
    description: |
      Path to app-level properties file in the repo.  Contains app-specific
      values such as:
        rtf.applicationName, rtf.replicas, rtf.cpuReserved, rtf.cpuMax,
        rtf.memoryReserved, rtf.memoryMax, skipTests
    required: false
    default: ''

  # ── Project ────────────────────────────────────────────────────
  pom_file_path:
    description: 'Path to the directory containing pom.xml'
    required: false
    default: 'java/my-app'
  skip_tests:
    description: '-DskipTests flag (true/false)'
    required: false
    default: ''

  # ── Anypoint Platform (can come from org properties file) ──────
  anypoint_uri:
    description: '-Danypoint.uri  (Anypoint Platform base URI)'
    required: false
    default: 'https://anypoint.mulesoft.com'
  anypoint_environment:
    description: '-Danypoint.environment  (Anypoint environment name)'
    required: false
    default: ''
  anypoint_business_group_id:
    description: '-Danypoint.businessGroupId'
    required: false
    default: ''

  # ── Connected App auth (secrets — always from caller) ──────────
  connected_app_client_id:
    description: '-Dconnected.app.clientId'
    required: true
  connected_app_client_secret:
    description: '-Dconnected.app.clientSecret'
    required: true
  connected_app_grant_type:
    description: '-Dconnected.app.grantType'
    required: false
    default: ''

  # ── RTF configuration (can come from either properties file) ───
  rtf_target:
    description: '-Drtf.target  (RTF cluster / target name)'
    required: false
    default: ''
  rtf_provider:
    description: '-Drtf.provider  (e.g. MC)'
    required: false
    default: ''
  rtf_application_name:
    description: '-Drtf.applicationName'
    required: false
    default: ''
  rtf_replicas:
    description: '-Drtf.replicas'
    required: false
    default: ''
  rtf_cpu_reserved:
    description: '-Drtf.cpuReserved  (e.g. 500m)'
    required: false
    default: ''
  rtf_cpu_max:
    description: '-Drtf.cpuMax  (e.g. 1000m)'
    required: false
    default: ''
  rtf_memory_reserved:
    description: '-Drtf.memoryReserved  (e.g. 700Mi)'
    required: false
    default: ''
  rtf_memory_max:
    description: '-Drtf.memoryMax  (e.g. 1000Mi)'
    required: false
    default: ''

  # ── Mule runtime (can come from either properties file) ────────
  mule_env:
    description: '-Dmule.env  (defaults to anypoint.environment)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # ── Step 1: Load app-level properties file ─────────────────
    - name: Load app properties file
      id: app-props
      shell: bash
      run: |
        PROPS_FILE="${{ inputs.app_properties_file }}"
        if [ -n "$PROPS_FILE" ] && [ -f "$PROPS_FILE" ]; then
          echo "📄 Loading app properties from $PROPS_FILE"
          while IFS='=' read -r key value; do
            [[ -z "$key" || "$key" == \#* || "$key" == \[* ]] && continue
            key=$(echo "$key" | xargs)
            value=$(echo "$value" | xargs)
            echo "  $key=$value"
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done < "$PROPS_FILE"
        else
          echo "ℹ️  No app properties file — skipping"
        fi

    # ── Step 2: Load org-level properties file ─────────────────
    - name: Load org properties file
      id: org-props
      shell: bash
      run: |
        PROPS_FILE="${{ inputs.deploy_properties_file }}"
        if [ -n "$PROPS_FILE" ] && [ -f "$PROPS_FILE" ]; then
          echo "📄 Loading org properties from $PROPS_FILE"
          while IFS='=' read -r key value; do
            [[ -z "$key" || "$key" == \#* || "$key" == \[* ]] && continue
            key=$(echo "$key" | xargs)
            value=$(echo "$value" | xargs)
            echo "  $key=$value"
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done < "$PROPS_FILE"
        else
          echo "ℹ️  No org properties file — skipping"
        fi

    # ── Step 3: Resolve final config ───────────────────────────
    #   Precedence: explicit input > org file > app file > default
    - name: Resolve configuration
      id: config
      shell: bash
      run: |
        resolve() {
          for val in "$@"; do
            if [ -n "$val" ]; then echo "$val"; return; fi
          done
        }

        # Org-level file values
        ORG_AP_ENV="${{ steps.org-props.outputs.anypoint.environment }}"
        ORG_BG_ID="${{ steps.org-props.outputs.anypoint.businessGroupId }}"
        ORG_RTF_TARGET="${{ steps.org-props.outputs.rtf.target }}"
        ORG_RTF_PROVIDER="${{ steps.org-props.outputs.rtf.provider }}"
        ORG_GRANT_TYPE="${{ steps.org-props.outputs.connected.app.grantType }}"
        ORG_MULE_ENV="${{ steps.org-props.outputs.mule.env }}"

        # App-level file values
        APP_NAME="${{ steps.app-props.outputs.rtf.applicationName }}"
        APP_REPLICAS="${{ steps.app-props.outputs.rtf.replicas }}"
        APP_CPU_RESERVED="${{ steps.app-props.outputs.rtf.cpuReserved }}"
        APP_CPU_MAX="${{ steps.app-props.outputs.rtf.cpuMax }}"
        APP_MEM_RESERVED="${{ steps.app-props.outputs.rtf.memoryReserved }}"
        APP_MEM_MAX="${{ steps.app-props.outputs.rtf.memoryMax }}"
        APP_PROVIDER="${{ steps.app-props.outputs.rtf.provider }}"
        APP_MULE_ENV="${{ steps.app-props.outputs.mule.env }}"
        APP_SKIP_TESTS="${{ steps.app-props.outputs.skipTests }}"

        # Resolve: input → org file → app file → hardcoded default
        echo "anypoint_environment=$(resolve  '${{ inputs.anypoint_environment }}'  "$ORG_AP_ENV")" >> "$GITHUB_OUTPUT"
        echo "anypoint_bg_id=$(resolve        '${{ inputs.anypoint_business_group_id }}' "$ORG_BG_ID")" >> "$GITHUB_OUTPUT"
        echo "rtf_target=$(resolve            '${{ inputs.rtf_target }}'            "$ORG_RTF_TARGET")" >> "$GITHUB_OUTPUT"
        echo "connected_app_grant_type=$(resolve '${{ inputs.connected_app_grant_type }}' "$ORG_GRANT_TYPE" 'client_credentials')" >> "$GITHUB_OUTPUT"
        echo "rtf_provider=$(resolve          '${{ inputs.rtf_provider }}'          "$ORG_RTF_PROVIDER" "$APP_PROVIDER" 'MC')" >> "$GITHUB_OUTPUT"
        echo "rtf_application_name=$(resolve  '${{ inputs.rtf_application_name }}'  "$APP_NAME")" >> "$GITHUB_OUTPUT"
        echo "rtf_replicas=$(resolve          '${{ inputs.rtf_replicas }}'          "$APP_REPLICAS" '1')" >> "$GITHUB_OUTPUT"
        echo "rtf_cpu_reserved=$(resolve      '${{ inputs.rtf_cpu_reserved }}'      "$APP_CPU_RESERVED" '500m')" >> "$GITHUB_OUTPUT"
        echo "rtf_cpu_max=$(resolve           '${{ inputs.rtf_cpu_max }}'           "$APP_CPU_MAX" '1000m')" >> "$GITHUB_OUTPUT"
        echo "rtf_memory_reserved=$(resolve   '${{ inputs.rtf_memory_reserved }}'   "$APP_MEM_RESERVED" '700Mi')" >> "$GITHUB_OUTPUT"
        echo "rtf_memory_max=$(resolve        '${{ inputs.rtf_memory_max }}'        "$APP_MEM_MAX" '1000Mi')" >> "$GITHUB_OUTPUT"
        echo "skip_tests=$(resolve            '${{ inputs.skip_tests }}'            "$APP_SKIP_TESTS" 'true')" >> "$GITHUB_OUTPUT"

        # mule.env: input → org file → app file → anypoint_environment
        RESOLVED_AP_ENV=$(resolve '${{ inputs.anypoint_environment }}' "$ORG_AP_ENV")
        echo "mule_env=$(resolve '${{ inputs.mule_env }}' "$ORG_MULE_ENV" "$APP_MULE_ENV" "$RESOLVED_AP_ENV")" >> "$GITHUB_OUTPUT"

        echo "✓ Configuration resolved (input > org file > app file > default)"

    # ── Step 4: Validate pom.xml ───────────────────────────────
    - name: Validate pom.xml path
      shell: bash
      run: |
        POM_DIR="${{ inputs.pom_file_path }}"
        ls -lrta $POM_DIR
        if [ ! -f "$POM_DIR/pom.xml" ]; then
          echo "::error::pom.xml not found at $POM_DIR/pom.xml"
          exit 1
        fi
        echo "✓ Found pom.xml at $POM_DIR/pom.xml"

    # ── Step 5: Extract artifact info ──────────────────────────
    - name: Extract artifact info
      id: extract-version
      shell: bash
      run: |
        POM_DIR="${{ inputs.pom_file_path }}"
        VERSION=$(mvn -f "$POM_DIR/pom.xml" help:evaluate -Dexpression=project.version -q -DforceStdout)
        NAME=$(mvn -f "$POM_DIR/pom.xml" help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "name=$NAME" >> "$GITHUB_OUTPUT"
        echo "📦 Artifact: $NAME-$VERSION"

    # ── Step 6: Build & execute mvn deploy ─────────────────────
    - name: Deploy to RTF via Maven
      shell: bash
      env:
        INPUT_CONNECTED_APP_CLIENT_ID: ${{ inputs.connected_app_client_id }}
        INPUT_CONNECTED_APP_CLIENT_SECRET: ${{ inputs.connected_app_client_secret }}
        INPUT_MULE_KEY: ${{ inputs.mule_key }}
      run: |
        # ── Build the mvn deploy command ──────────────────────────
        CMD="mvn deploy -f ${{ inputs.pom_file_path }}/pom.xml"
        CMD="$CMD -DmuleDeploy"
        CMD="$CMD -DskipTests=${{ steps.config.outputs.skip_tests }}"

        # Anypoint Platform
        CMD="$CMD -Danypoint.uri=${{ inputs.anypoint_uri }}"
        CMD="$CMD -Danypoint.environment=${{ steps.config.outputs.anypoint_environment }}"
        CMD="$CMD -Danypoint.businessGroupId=${{ steps.config.outputs.anypoint_bg_id }}"

        # Connected App auth
        CMD="$CMD -Dconnected.app.clientId=${INPUT_CONNECTED_APP_CLIENT_ID}"
        CMD="$CMD -Dconnected.app.clientSecret=${INPUT_CONNECTED_APP_CLIENT_SECRET}"
        CMD="$CMD -Dconnected.app.grantType=${{ steps.config.outputs.connected_app_grant_type }}"

        # RTF
        CMD="$CMD -Drtf.target=${{ steps.config.outputs.rtf_target }}"
        CMD="$CMD -Drtf.provider=${{ steps.config.outputs.rtf_provider }}"
        CMD="$CMD -Drtf.applicationName=${{ steps.config.outputs.rtf_application_name }}"
        CMD="$CMD -Drtf.replicas=${{ steps.config.outputs.rtf_replicas }}"
        CMD="$CMD -Drtf.cpuReserved=${{ steps.config.outputs.rtf_cpu_reserved }}"
        CMD="$CMD -Drtf.cpuMax=${{ steps.config.outputs.rtf_cpu_max }}"
        CMD="$CMD -Drtf.memoryReserved=${{ steps.config.outputs.rtf_memory_reserved }}"
        CMD="$CMD -Drtf.memoryMax=${{ steps.config.outputs.rtf_memory_max }}"

        # Mule runtime
        CMD="$CMD -Dmule.env=${{ steps.config.outputs.mule_env }}"

        # Mule encryption key (only if provided)
        if [ -n "${INPUT_MULE_KEY}" ]; then
          CMD="$CMD -Dmule.key=${INPUT_MULE_KEY}"
        fi

        # ── Log a redacted version ────────────────────────────────
        SAFE_CMD=$(echo "$CMD" | sed \
          -e "s/-Dconnected.app.clientId=[^ ]*/-Dconnected.app.clientId=***/" \
          -e "s/-Dconnected.app.clientSecret=[^ ]*/-Dconnected.app.clientSecret=***/" \
          -e "s/-Dmule.key=[^ ]*/-Dmule.key=***/")

        echo "═══════════════════════════════════════════════════════"
        echo "🚀 DEPLOYING TO RTF"
        echo "═══════════════════════════════════════════════════════"
        echo ""
        echo "Application: ${{ steps.config.outputs.rtf_application_name }}"
        echo "Target:      ${{ steps.config.outputs.rtf_target }}"
        echo "Replicas:    ${{ steps.config.outputs.rtf_replicas }}"
        echo "CPU:         ${{ steps.config.outputs.rtf_cpu_reserved }} / ${{ steps.config.outputs.rtf_cpu_max }}"
        echo "Memory:      ${{ steps.config.outputs.rtf_memory_reserved }} / ${{ steps.config.outputs.rtf_memory_max }}"
        echo ""
        echo "Maven command (redacted):"
        echo "$SAFE_CMD"
        echo ""

        # ── Execute ───────────────────────────────────────────────
        eval "$CMD"
