name: 'Mule RTF Deploy via Maven'
description: |
  Deploys a MuleSoft application to Runtime Fabric (RTF) using mvn deploy.
  The deploy properties file contains all Maven -D flags (key=value format).
  The caller can override any property via the optional action inputs
  (typically for org/env-specific values common across all applications).

inputs:
  # ── Deploy config ───────────────────────────────────────────────
  deploy_properties_file:
    description: 'Path to deploy properties file (e.g. deploy-properties/dev-properties)'
    required: false
    default: 'deploy-properties/dev-properties'
  pom_file_path:
    description: 'Path to the directory containing pom.xml'
    required: false
    default: 'java/my-app'

  # ── Secrets (always from caller) ────────────────────────────────
  connected_app_client_id:
    description: '-Dconnected.app.clientId'
    required: true
  connected_app_client_secret:
    description: '-Dconnected.app.clientSecret'
    required: true
  mule_key:
    description: '-Dmule.key  (Mule encryption key — optional)'
    required: false
    default: ''

  # ── Caller overrides (org/env-specific) ─────────────────────────
  # Any non-empty value overrides the matching key from the properties file.
  anypoint_uri:
    description: 'Override anypoint.uri'
    required: false
    default: ''
  anypoint_environment:
    description: 'Override anypoint.environment'
    required: false
    default: ''
  anypoint_business_group_id:
    description: 'Override anypoint.businessGroupId'
    required: false
    default: ''
  connected_app_grant_type:
    description: 'Override connected.app.grantType'
    required: false
    default: ''
  rtf_target:
    description: 'Override rtf.target'
    required: false
    default: ''
  rtf_provider:
    description: 'Override rtf.provider'
    required: false
    default: ''
  rtf_application_name:
    description: 'Override rtf.applicationName'
    required: false
    default: ''
  rtf_replicas:
    description: 'Override rtf.replicas'
    required: false
    default: ''
  rtf_cpu_reserved:
    description: 'Override rtf.cpuReserved'
    required: false
    default: ''
  rtf_cpu_max:
    description: 'Override rtf.cpuMax'
    required: false
    default: ''
  rtf_memory_reserved:
    description: 'Override rtf.memoryReserved'
    required: false
    default: ''
  rtf_memory_max:
    description: 'Override rtf.memoryMax'
    required: false
    default: ''
  mule_env:
    description: 'Override mule.env'
    required: false
    default: ''
  skip_tests:
    description: 'Override skipTests'
    required: false
    default: ''

  # ── deploymentSettings overrides (from RTF deploy reference) ───
  enforce_deploying_replicas_across_nodes:
    description: 'Override rtf.enforceDeployingReplicasAcrossNodes (true/false)'
    required: false
    default: ''
  update_strategy:
    description: 'Override updateStrategy (rolling/recreate)'
    required: false
    default: ''
  clustered:
    description: 'Override clustered (true/false)'
    required: false
    default: ''
  http_inbound_public_url:
    description: 'Override http.inbound.publicUrl'
    required: false
    default: ''
  persistent_object_store:
    description: 'Override persistentObjectStore (true/false)'
    required: false
    default: ''
  jvm_args:
    description: 'Override rtf.jvm.args (space-separated JVM arguments)'
    required: false
    default: ''
  generate_default_public_url:
    description: 'Override generateDefaultPublicUrl (true/false)'
    required: false
    default: ''
  disable_am_log_forwarding:
    description: 'Override disableAmLogForwarding (true/false)'
    required: false
    default: ''
  autoscaling_enabled:
    description: 'Override autoscaling.enabled (true/false)'
    required: false
    default: ''
  autoscaling_min_replicas:
    description: 'Override autoscaling.minReplicas'
    required: false
    default: ''
  autoscaling_max_replicas:
    description: 'Override autoscaling.maxReplicas'
    required: false
    default: ''
  deployment_timeout:
    description: 'Override deploymentTimeout (milliseconds)'
    required: false
    default: ''
  mule_version:
    description: 'Override muleVersion (e.g. 4.6.0 or 4.6.0:1e-java17)'
    required: false
    default: ''
  release_channel:
    description: 'Override releaseChannel (NONE/EDGE/LTS)'
    required: false
    default: ''
  java_version:
    description: 'Override javaVersion (8/17)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # ── Step 1: Build the Maven command ──────────────────────────
    - name: Build deploy command
      id: config
      shell: bash
      env:
        DEPLOY_PROPERTIES_FILE: ${{ inputs.deploy_properties_file }}
        POM_FILE_PATH: ${{ inputs.pom_file_path }}
        # Caller overrides (non-empty values override the properties file)
        ANYPOINT_URI: ${{ inputs.anypoint_uri }}
        ANYPOINT_ENVIRONMENT: ${{ inputs.anypoint_environment }}
        ANYPOINT_BUSINESS_GROUP_ID: ${{ inputs.anypoint_business_group_id }}
        CONNECTED_APP_GRANT_TYPE: ${{ inputs.connected_app_grant_type }}
        RTF_TARGET: ${{ inputs.rtf_target }}
        RTF_PROVIDER: ${{ inputs.rtf_provider }}
        RTF_APPLICATION_NAME: ${{ inputs.rtf_application_name }}
        RTF_REPLICAS: ${{ inputs.rtf_replicas }}
        RTF_CPU_RESERVED: ${{ inputs.rtf_cpu_reserved }}
        RTF_CPU_MAX: ${{ inputs.rtf_cpu_max }}
        RTF_MEMORY_RESERVED: ${{ inputs.rtf_memory_reserved }}
        RTF_MEMORY_MAX: ${{ inputs.rtf_memory_max }}
        MULE_ENV: ${{ inputs.mule_env }}
        SKIP_TESTS: ${{ inputs.skip_tests }}
        # deploymentSettings overrides
        ENFORCE_DEPLOYING_REPLICAS_ACROSS_NODES: ${{ inputs.enforce_deploying_replicas_across_nodes }}
        UPDATE_STRATEGY: ${{ inputs.update_strategy }}
        CLUSTERED: ${{ inputs.clustered }}
        HTTP_INBOUND_PUBLIC_URL: ${{ inputs.http_inbound_public_url }}
        PERSISTENT_OBJECT_STORE: ${{ inputs.persistent_object_store }}
        JVM_ARGS: ${{ inputs.jvm_args }}
        GENERATE_DEFAULT_PUBLIC_URL: ${{ inputs.generate_default_public_url }}
        DISABLE_AM_LOG_FORWARDING: ${{ inputs.disable_am_log_forwarding }}
        AUTOSCALING_ENABLED: ${{ inputs.autoscaling_enabled }}
        AUTOSCALING_MIN_REPLICAS: ${{ inputs.autoscaling_min_replicas }}
        AUTOSCALING_MAX_REPLICAS: ${{ inputs.autoscaling_max_replicas }}
        DEPLOYMENT_TIMEOUT: ${{ inputs.deployment_timeout }}
        MULE_VERSION: ${{ inputs.mule_version }}
        RELEASE_CHANNEL: ${{ inputs.release_channel }}
        JAVA_VERSION: ${{ inputs.java_version }}
        MULE_KEY: ${{ inputs.mule_key }}
      run: python3 "$GITHUB_ACTION_PATH/resolve_config.py"

    # ── Step 2: Execute mvn deploy ───────────────────────────────
    - name: Deploy to RTF via Maven
      shell: bash
      env:
        CONNECTED_APP_CLIENT_ID: ${{ inputs.connected_app_client_id }}
        CONNECTED_APP_CLIENT_SECRET: ${{ inputs.connected_app_client_secret }}
        MULE_KEY: ${{ inputs.mule_key }}
        MVN_COMMAND: ${{ steps.config.outputs.mvn_command }}
      run: |
        echo "::add-mask::${CONNECTED_APP_CLIENT_ID}"
        echo "::add-mask::${CONNECTED_APP_CLIENT_SECRET}"
        if [ -n "$MULE_KEY" ]; then echo "::add-mask::${MULE_KEY}"; fi
        eval "$MVN_COMMAND"
