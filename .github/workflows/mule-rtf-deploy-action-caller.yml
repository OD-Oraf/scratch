name: Mule RTF Deploy (Action Implementation)

run-name: "RTF Deploy ${{ inputs.environment }} [${{ inputs.environment == 'dev' && inputs.branch || inputs.tag }}]"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        type: choice
        options:
          - dev
          - sit
          - uat
          - prd
        required: true
        default: 'dev'
      pom_file_path:
        description: 'Path to the directory containing pom.xml'
        type: string
        required: false
        default: 'java/gs-rest-service'
      branch:
        description: 'Branch to deploy (dev only)'
        type: string
        required: false
        default: 'develop'
      tag:
        description: 'Tag to deploy (required for sit/uat/prd)'
        type: string
        required: false
        default: ''

      rtf_cpu_reserved:
        description: 'CPU reserved override (default: env-tier standard)'
        type: string
        required: false
        default: ''
      rtf_cpu_max:
        description: 'CPU max override (default: env-tier standard)'
        type: string
        required: false
        default: ''
      rtf_memory_reserved:
        description: 'Memory reserved override (default: env-tier standard)'
        type: string
        required: false
        default: ''
      rtf_memory_max:
        description: 'Memory max override (default: env-tier standard)'
        type: string
        required: false
        default: ''

env:
  anypoint_uri: 'https://anypoint.mulesoft.com'
# ─────────────────────────────────────────────────────────────────
# Three-tier override hierarchy (each tier wins over the one below):
#   1. Dispatch inputs       — per-run overrides (e.g. load testing)
#   2. Caller case statement — org-wide resource standards per env tier
#   3. Properties file       — app-level defaults & identity
#      (<pom_path>/deploy-properties/<env>.properties)
#
# App teams own: rtf.applicationName, rtf.replicas, mule.env, skipTests
# Org standards: CPU/memory limits enforced centrally via this workflow
# Per-run:       any resource input passed at dispatch time
# ─────────────────────────────────────────────────────────────────

jobs:
  deploy-to-rtf:
    name: Deploy to RTF (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.environment == 'dev' && inputs.branch || inputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles(format('{0}/pom.xml', inputs.pom_file_path)) }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ── Resolve resource limits (tier defaults → dispatch overrides) ──
      - name: Resolve resource limits
        id: env-overrides
        env:
          INPUT_CPU_RESERVED:  ${{ inputs.rtf_cpu_reserved }}
          INPUT_CPU_MAX:       ${{ inputs.rtf_cpu_max }}
          INPUT_MEM_RESERVED:  ${{ inputs.rtf_memory_reserved }}
          INPUT_MEM_MAX:       ${{ inputs.rtf_memory_max }}
        run: |
          # Org-wide tier defaults
          case "${{ inputs.environment }}" in
            dev)     CPU_RESERVED=500m  CPU_MAX=1000m  MEM_RESERVED=700Mi  MEM_MAX=1000Mi ;;
            sit)     CPU_RESERVED=500m  CPU_MAX=1000m  MEM_RESERVED=700Mi  MEM_MAX=1000Mi ;;
            uat)     CPU_RESERVED=750m  CPU_MAX=1500m  MEM_RESERVED=1000Mi MEM_MAX=1500Mi ;;
            prd)     CPU_RESERVED=1000m CPU_MAX=2000m  MEM_RESERVED=1500Mi MEM_MAX=2000Mi ;;
          esac

          # Per-run dispatch inputs win when provided
          [ -n "$INPUT_CPU_RESERVED" ] && CPU_RESERVED="$INPUT_CPU_RESERVED"
          [ -n "$INPUT_CPU_MAX" ]      && CPU_MAX="$INPUT_CPU_MAX"
          [ -n "$INPUT_MEM_RESERVED" ] && MEM_RESERVED="$INPUT_MEM_RESERVED"
          [ -n "$INPUT_MEM_MAX" ]      && MEM_MAX="$INPUT_MEM_MAX"

          echo "rtf_cpu_reserved=$CPU_RESERVED"    >> "$GITHUB_OUTPUT"
          echo "rtf_cpu_max=$CPU_MAX"              >> "$GITHUB_OUTPUT"
          echo "rtf_memory_reserved=$MEM_RESERVED" >> "$GITHUB_OUTPUT"
          echo "rtf_memory_max=$MEM_MAX"           >> "$GITHUB_OUTPUT"

      # ── Deploy — properties file is the base, inputs override ───
      - name: Deploy to RTF
        uses: OD-ORaf/scratch/.github/actions/mule-rtf-deploy
        with:
          deploy_properties_file: ${{ inputs.pom_file_path }}/deploy-properties/${{ inputs.environment }}.properties
          pom_file_path: ${{ inputs.pom_file_path }}
          # Secrets
          connected_app_client_id: ${{ secrets.CONNECTED_APP_CLIENT_ID }}
          connected_app_client_secret: ${{ secrets.CONNECTED_APP_CLIENT_SECRET }}
          mule_key: ${{ secrets.MULE_KEY }}
          # ── Org/env overrides ────────────────────────────────────────
          anypoint_uri: ${{ inputs.anypoint_uri }}
          anypoint_environment: ${{ vars[format('{0}_ANYPOINT_ENVIRONMENT', inputs.environment)] }}
          anypoint_business_group_id: ${{ vars.ANYPOINT_BUSINESS_GROUP_ID }}
          rtf_target: ${{ vars[format('{0}_RTF_TARGET', inputs.environment)] }}
          rtf_provider: ${{ vars.RTF_PROVIDER }}
          connected_app_grant_type: ${{ vars.CONNECTED_APP_GRANT_TYPE }}
          mule_env: ${{ inputs.environment }}
          # ── Env-specific resource overrides ──────────────────────────
          rtf_cpu_reserved: ${{ steps.env-overrides.outputs.rtf_cpu_reserved }}
          rtf_cpu_max: ${{ steps.env-overrides.outputs.rtf_cpu_max }}
          rtf_memory_reserved: ${{ steps.env-overrides.outputs.rtf_memory_reserved }}
          rtf_memory_max: ${{ steps.env-overrides.outputs.rtf_memory_max }}
