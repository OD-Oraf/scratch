name: Mule RTF Deploy (Action Implementation)

run-name: "RTF Deploy ${{ inputs.environment }} [${{ inputs.environment == 'dev' && inputs.branch || inputs.tag }}]"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        type: choice
        options:
          - dev
          - sit
          - uat
          - prd
        required: true
        default: 'dev'
      pom_file_path:
        description: 'Path to the directory containing pom.xml'
        type: string
        required: false
        default: 'java/gs-rest-service'
      branch:
        description: 'Branch to deploy (dev only)'
        type: string
        required: false
        default: 'develop'
      tag:
        description: 'Tag to deploy (required for sit/uat/prd)'
        type: string
        required: false
        default: ''
      anypoint_uri:
        description: 'Anypoint Platform base URI'
        type: string
        required: false
        default: 'https://anypoint.mulesoft.com'

# ─────────────────────────────────────────────────────────────────
# The app's properties file (<pom_path>/deploy-properties/<env>.properties)
# contains all Maven -D flags for the deployment.  The caller passes
# org/env-specific overrides (anypoint.environment, rtf.target, etc.)
# as action inputs — these take priority over the file values.
# ─────────────────────────────────────────────────────────────────

jobs:
  deploy-to-rtf:
    name: Deploy to RTF (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Validate tag for non-dev environments
        if: ${{ inputs.environment != 'dev' && inputs.tag == '' }}
        run: |
          echo "::error::Tag is required for non-dev environments (environment=${{ inputs.environment }})"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.environment == 'dev' && inputs.branch || inputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles(format('{0}/pom.xml', inputs.pom_file_path)) }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ── Set env-specific overrides ──────────────────────────────
      - name: Set environment overrides
        id: env-overrides
        run: |
          case "${{ inputs.environment }}" in
            dev)
              echo "rtf_cpu_reserved=500m"   >> "$GITHUB_OUTPUT"
              echo "rtf_cpu_max=1000m"       >> "$GITHUB_OUTPUT"
              echo "rtf_memory_reserved=700Mi" >> "$GITHUB_OUTPUT"
              echo "rtf_memory_max=1000Mi"   >> "$GITHUB_OUTPUT"
              ;;
            sit)
              echo "rtf_cpu_reserved=500m"   >> "$GITHUB_OUTPUT"
              echo "rtf_cpu_max=1000m"       >> "$GITHUB_OUTPUT"
              echo "rtf_memory_reserved=700Mi" >> "$GITHUB_OUTPUT"
              echo "rtf_memory_max=1000Mi"   >> "$GITHUB_OUTPUT"
              ;;
            uat)
              echo "rtf_cpu_reserved=750m"   >> "$GITHUB_OUTPUT"
              echo "rtf_cpu_max=1500m"       >> "$GITHUB_OUTPUT"
              echo "rtf_memory_reserved=1000Mi" >> "$GITHUB_OUTPUT"
              echo "rtf_memory_max=1500Mi"   >> "$GITHUB_OUTPUT"
              ;;
            prd)
              echo "rtf_cpu_reserved=1000m"  >> "$GITHUB_OUTPUT"
              echo "rtf_cpu_max=2000m"       >> "$GITHUB_OUTPUT"
              echo "rtf_memory_reserved=1500Mi" >> "$GITHUB_OUTPUT"
              echo "rtf_memory_max=2000Mi"   >> "$GITHUB_OUTPUT"
              ;;
          esac

      # ── Deploy — properties file is the base, inputs override ───
      - name: Deploy to RTF
        uses: ./.github/actions/mule-rtf-deploy
        with:
          deploy_properties_file: ${{ inputs.pom_file_path }}/deploy-properties/${{ inputs.environment }}.properties
          pom_file_path: ${{ inputs.pom_file_path }}
          # Secrets
          connected_app_client_id: ${{ secrets.CONNECTED_APP_CLIENT_ID }}
          connected_app_client_secret: ${{ secrets.CONNECTED_APP_CLIENT_SECRET }}
          mule_key: ${{ secrets.MULE_KEY }}
          # ── Org/env overrides ────────────────────────────────────────
          anypoint_uri: ${{ inputs.anypoint_uri }}
          anypoint_environment: ${{ vars[format('{0}_ANYPOINT_ENVIRONMENT', inputs.environment)] }}
          anypoint_business_group_id: ${{ vars.ANYPOINT_BUSINESS_GROUP_ID }}
          rtf_target: ${{ vars[format('{0}_RTF_TARGET', inputs.environment)] }}
          rtf_provider: ${{ vars.RTF_PROVIDER }}
          connected_app_grant_type: ${{ vars.CONNECTED_APP_GRANT_TYPE }}
          mule_env: ${{ inputs.environment }}
          # ── Env-specific resource overrides ──────────────────────────
          rtf_cpu_reserved: ${{ steps.env-overrides.outputs.rtf_cpu_reserved }}
          rtf_cpu_max: ${{ steps.env-overrides.outputs.rtf_cpu_max }}
          rtf_memory_reserved: ${{ steps.env-overrides.outputs.rtf_memory_reserved }}
          rtf_memory_max: ${{ steps.env-overrides.outputs.rtf_memory_max }}
