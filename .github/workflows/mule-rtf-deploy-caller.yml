name: Mule RTF Deploy (Action Implementation)

run-name: "RTF Deploy ${{ inputs.environment }} [${{ inputs.environment == 'dev' && inputs.branch || inputs.tag }}]"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        type: choice
        options:
          - dev
          - sit
          - uat
          - prd
        required: true
        default: 'dev'
      pom_file_path:
        description: 'Path to the directory containing pom.xml'
        type: string
        required: false
        default: 'java/my-app'
      branch:
        description: 'Branch to deploy (dev only)'
        type: string
        required: false
        default: 'develop'
      tag:
        description: 'Tag to deploy (required for sit/uat/prd)'
        type: string
        required: false
        default: ''
      anypoint_uri:
        description: 'Anypoint Platform base URI'
        type: string
        required: false
        default: 'https://anypoint.mulesoft.com'

# ─────────────────────────────────────────────────────────────────
# Configuration layers:
#   1. Org-level  — hardcoded in "Write org deploy properties" below
#                   (same for every app in this org, varies per env)
#   2. App-level  — loaded from <pom_path>/deploy/<env>.properties
#                   (checked into the app repo)
#   Org properties are written to a temp file at runtime and passed
#   to the composite action.  The action merges both files with
#   precedence: explicit input > org file > app file > defaults.
# ─────────────────────────────────────────────────────────────────

jobs:
  deploy-to-rtf:
    name: Deploy to RTF (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Validate tag for non-dev environments
        if: ${{ inputs.environment != 'dev' && inputs.tag == '' }}
        run: |
          echo "::error::Tag is required for non-dev environments (environment=${{ inputs.environment }})"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.environment == 'dev' && inputs.branch || inputs.tag }}

      # ── Org-specific configuration (hardcoded per environment) ───
      - name: Write org deploy properties
        id: org-config
        run: |
          ORG_PROPS_FILE="${RUNNER_TEMP}/org-deploy.properties"

          case "${{ inputs.environment }}" in
            dev)
              cat > "$ORG_PROPS_FILE" <<'EOF'
          # GIP Org — DEV environment
          anypoint.environment=Development
          anypoint.businessGroupId=gip
          rtf.target=gip-rtf-cluster-dev
          rtf.provider=MC
          connected.app.grantType=client_credentials
          mule.env=dev
          EOF
              ;;
            sit)
              cat > "$ORG_PROPS_FILE" <<'EOF'
          # GIP Org — SIT environment
          anypoint.environment=Sit
          anypoint.businessGroupId=gip
          rtf.target=gip-rtf-cluster-sit
          rtf.provider=MC
          connected.app.grantType=client_credentials
          mule.env=sit
          EOF
              ;;
            uat)
              cat > "$ORG_PROPS_FILE" <<'EOF'
          # GIP Org — UAT environment
          anypoint.environment=Uat
          anypoint.businessGroupId=gip
          rtf.target=gip-rtf-cluster-uat
          rtf.provider=MC
          connected.app.grantType=client_credentials
          mule.env=uat
          EOF
              ;;
            prd)
              cat > "$ORG_PROPS_FILE" <<'EOF'
          # GIP Org — PRD environment
          anypoint.environment=Production
          anypoint.businessGroupId=gip
          rtf.target=gip-rtf-cluster-prd
          rtf.provider=MC
          connected.app.grantType=client_credentials
          mule.env=prd
          EOF
              ;;
            *)
              echo "::error::Unknown environment: ${{ inputs.environment }}"
              exit 1
              ;;
          esac

          echo "org_props_file=$ORG_PROPS_FILE" >> "$GITHUB_OUTPUT"
          echo "📄 Org properties written to $ORG_PROPS_FILE"
          cat "$ORG_PROPS_FILE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles(format('{0}/pom.xml', inputs.pom_file_path)) }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Deploy to RTF
        uses: ./.github/actions/mule-rtf-deploy
        with:
          # Org-level config (written above)
          deploy_properties_file: ${{ steps.org-config.outputs.org_props_file }}
          # App-level config (from the app repo — merged by the action)
          app_properties_file: ${{ inputs.pom_file_path }}/deploy/${{ inputs.environment }}.properties
          pom_file_path: ${{ inputs.pom_file_path }}
          # Org-level values that are always the same regardless of env
          anypoint_uri: ${{ inputs.anypoint_uri }}
          # Secrets (org-level)
          connected_app_client_id: ${{ secrets.CONNECTED_APP_CLIENT_ID }}
          connected_app_client_secret: ${{ secrets.CONNECTED_APP_CLIENT_SECRET }}
          mule_key: ${{ secrets.MULE_KEY }}
