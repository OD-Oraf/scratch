name: Push workflow templates

run-name: "Push workflow templates (${{ inputs.template }} → OD-Oraf/${{ inputs.repo }})"

on:
  workflow_dispatch:
    inputs:
      template:
        description: "Which template(s) to push"
        type: choice
        required: true
        default: non-prod
        options:
          - prod
          - non-prod
          - both
      repo:
        description: "Target repository name (under OD-Oraf)"
        type: string
        required: true
      dry_run:
        description: "Dry run — show what would happen without pushing"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  push-templates:
    name: Push templates
    runs-on: ubuntu-latest

    env:
      # PAT with `repo` + `workflow` scopes. GITHUB_TOKEN can't write
      # workflow files in other repos.
      GH_TOKEN: ${{ secrets.GH_PAT }}
      PROD_TEMPLATE: .github/workflow-templates/prod-template.yml
      NONPROD_TEMPLATE: .github/workflow-templates/non-prod-template.yml
      PROD_DEST: .github/workflows/prod.yml
      NONPROD_DEST: .github/workflows/non-prod.yml
      FULL_REPO: OD-Oraf/${{ inputs.repo }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate token
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Secret GH_PAT is not set. It must be a PAT with 'repo' and 'workflow' scopes."
            exit 1
          fi
          gh auth status

      - name: Make scripts executable
        run: chmod +x gh-cli/api/*.sh

      - name: Push prod template
        if: ${{ inputs.template == 'prod' || inputs.template == 'both' }}
        run: |
          set -euo pipefail
          DRY_FLAG=""
          [ "${{ inputs.dry_run }}" = "true" ] && DRY_FLAG="--dry-run"
          ./gh-cli/api/update_workflow_single_repo.sh "$PROD_TEMPLATE" "$FULL_REPO" "$PROD_DEST" $DRY_FLAG

      - name: Push non-prod template
        if: ${{ inputs.template == 'non-prod' || inputs.template == 'both' }}
        run: |
          set -euo pipefail
          DRY_FLAG=""
          [ "${{ inputs.dry_run }}" = "true" ] && DRY_FLAG="--dry-run"
          ./gh-cli/api/update_workflow_single_repo.sh "$NONPROD_TEMPLATE" "$FULL_REPO" "$NONPROD_DEST" $DRY_FLAG