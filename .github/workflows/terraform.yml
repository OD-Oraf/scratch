name: Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to run'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      backend_key:
        description: 'S3 key (path within the state bucket) for the Terraform state file'
        required: false
        default: 'esb-demo/terraform.tfstate'
  pull_request:
    paths:
      - 'terraform/esb-demo/**'
      - '.github/workflows/terraform.yml'

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: terraform/esb-demo
  IAM_ROLE_ARN: arn:aws:iam::289491622160:role/esb-ssm-role

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform init
        env:
          BACKEND_KEY: ${{ github.event.inputs.backend_key || 'esb-demo/terraform.tfstate' }}
        run: terraform init -reconfigure -backend-config="key=${BACKEND_KEY}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event_name == 'pull_request' || github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply'
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve
