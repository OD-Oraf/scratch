# Deploy configuration for DEV environment
# Every key=value becomes a Maven -D flag.
# The caller workflow can override any value (e.g. org-specific targets).

# ── App-specific ──────────────────────────────────────────────────
rtf.applicationName=my-mule-app
rtf.replicas=1
rtf.cpuReserved=500m
rtf.cpuMax=1000m
rtf.memoryReserved=700Mi
rtf.memoryMax=1000Mi
skipTests=true

# ── Org/env defaults (overridden by caller for each org) ─────────
anypoint.environment=development
anypoint.businessGroupId=gip
rtf.target=gip-rtf-cluster-dev
rtf.provider=MC
connected.app.grantType=client_credentials
mule.env=dev
